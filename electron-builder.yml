appId: com.digitaltolk.ex.electron
productName: ex
copyright: Copyright © 2026 DigitalTolk
directories:
  output: release
  buildResources: prebuilt

files:
  - dist/**/*
  - package.json
  - "!**/*.map"

asar: true

mac:
  category: public.app-category.business
  icon: prebuilt/icon.icns
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # CFBundleIconName drives macOS 26's dynamic icon rendering from Assets.car
  # (Aqua / DarkAqua / Tinted / Clear / liquid-glass). CFBundleIconFile stays
  # set to the static icon.icns as a fallback for older systems.
  extendInfo:
    CFBundleIconName: AppIcon
  extraResources:
    - from: prebuilt/Assets.car
      to: Assets.car

linux:
  icon: prebuilt/icon.png
  category: Network
  # .deb requires a maintainer with an email address. fpm reads this when
  # generating Debian control metadata; without it the deb step aborts.
  maintainer: DigitalTolk <dev@digitaltolk.com>
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

win:
  icon: prebuilt/icon.ico
  # The Focus Assist addon (main.ts DnD bridge) is required at runtime on
  # Windows only. The top-level files list ships just dist/, so the module
  # and its require chain are added here; the .node binary must live outside
  # the asar for Windows to load it.
  files:
    - node_modules/windows-focus-assist/**
    - node_modules/bindings/**
    - node_modules/file-uri-to-path/**
  asarUnpack:
    - node_modules/windows-focus-assist/**/*.node
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

extraResources:
  - from: prebuilt/icon.png
    to: icons/icon.png
  - from: prebuilt/icon.ico
    to: icons/icon.ico
  - from: prebuilt/tray.png
    to: icons/tray.png
  - from: prebuilt/tray@2x.png
    to: icons/tray@2x.png
  - from: prebuilt/trayBadged.png
    to: icons/trayBadged.png
  - from: prebuilt/trayBadged@2x.png
    to: icons/trayBadged@2x.png
  - from: prebuilt/trayTemplate.png
    to: icons/trayTemplate.png
  - from: prebuilt/trayTemplate@2x.png
    to: icons/trayTemplate@2x.png
  - from: prebuilt/trayBadgedLight.png
    to: icons/trayBadgedLight.png
  - from: prebuilt/trayBadgedLight@2x.png
    to: icons/trayBadgedLight@2x.png
  - from: prebuilt/trayBadgedDark.png
    to: icons/trayBadgedDark.png
  - from: prebuilt/trayBadgedDark@2x.png
    to: icons/trayBadgedDark@2x.png
  - from: assets/ex.icon
    to: AppIcon.icon
