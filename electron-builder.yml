appId: com.digitaltolk.ex.electron
productName: ex
copyright: Copyright © 2026 DigitalTolk
directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - "!**/*.map"

asar: true

mac:
  category: public.app-category.business
  icon: build/icon.icns
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # CFBundleIconName drives macOS 26's dynamic icon rendering from Assets.car
  # (Aqua / DarkAqua / Tinted / Clear / liquid-glass). CFBundleIconFile stays
  # set to the static icon.icns as a fallback for older systems.
  extendInfo:
    CFBundleIconName: AppIcon
  extraResources:
    - from: build/Assets.car
      to: Assets.car

linux:
  icon: build/icon.png
  category: Network
  # .deb requires a maintainer with an email address. fpm reads this when
  # generating Debian control metadata; without it the deb step aborts.
  maintainer: DigitalTolk <dev@digitaltolk.com>
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

extraResources:
  - from: build/icon.png
    to: icons/icon.png
  - from: build/icon.ico
    to: icons/icon.ico
  - from: build/tray.png
    to: icons/tray.png
  - from: build/tray@2x.png
    to: icons/tray@2x.png
  - from: build/trayBadged.png
    to: icons/trayBadged.png
  - from: build/trayBadged@2x.png
    to: icons/trayBadged@2x.png
  - from: build/trayTemplate.png
    to: icons/trayTemplate.png
  - from: build/trayTemplate@2x.png
    to: icons/trayTemplate@2x.png
  - from: build/trayBadgedLight.png
    to: icons/trayBadgedLight.png
  - from: build/trayBadgedLight@2x.png
    to: icons/trayBadgedLight@2x.png
  - from: build/trayBadgedDark.png
    to: icons/trayBadgedDark.png
  - from: build/trayBadgedDark@2x.png
    to: icons/trayBadgedDark@2x.png
  - from: assets/ex.icon
    to: AppIcon.icon
