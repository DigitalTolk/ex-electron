<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ex — Connect</title>
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <style>
      /*
       * Visual language follows the DigitalTolk brand book:
       *   surface = white   (~70%)
       *   text    = #231F20 ("DT Black", ~25%)
       *   accent  = #DE5D83 ("Blush Pink", ~5%)
       * Headings target Futura PT (Futura on macOS, system fallback elsewhere);
       * body uses Proxima Nova where present and Avenir Next / Inter / system
       * sans as the fallback chain. Backgrounds stay white per brand rules
       * — no pink fields, no gradients.
       */
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      :root {
        --dt-black: #231F20;
        --dt-black-hover: #3a3436;
        --dt-pink:  #DE5D83;
        --dt-line:  #E5E1E2;
        --dt-muted: #6B6466;
        --dt-error: #B91C1C;
      }
      body {
        display: grid;
        place-items: center;
        font: 16px/1.5 "Proxima Nova", "Avenir Next", "Inter",
              -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--dt-black);
        background: #fff;
        -webkit-user-select: none;
      }
      .card {
        width: 480px;
        padding: 56px 56px 44px;
      }
      .brand {
        margin-bottom: 32px;
      }
      .brand svg {
        width: 64px;
        height: 64px;
        display: block;
      }
      h1 {
        margin: 0 0 8px;
        font-family: "Futura", "Futura PT", "Avenir Next", -apple-system, sans-serif;
        font-weight: 600;
        font-size: 30px;
        letter-spacing: -0.01em;
        color: var(--dt-black);
      }
      p.sub {
        margin: 0 0 32px;
        color: var(--dt-muted);
        font-size: 15px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--dt-muted);
        margin-bottom: 8px;
      }
      input[type="url"] {
        width: 100%;
        padding: 14px 16px;
        font: inherit;
        font-size: 16px;
        color: var(--dt-black);
        border: 1px solid var(--dt-line);
        border-radius: 10px;
        outline: none;
        background: #fff;
        -webkit-user-select: text; user-select: text;
        transition: border-color 120ms ease, box-shadow 120ms ease;
      }
      input[type="url"]:hover { border-color: #C9C2C4; }
      input[type="url"]:focus {
        border-color: var(--dt-black);
        box-shadow: 0 0 0 3px rgba(35, 31, 32, 0.12);
      }
      button {
        margin-top: 24px;
        width: 100%;
        padding: 14px 16px;
        background: var(--dt-black);
        color: #fff;
        border: 0;
        border-radius: 10px;
        font: inherit;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.01em;
        cursor: pointer;
        transition: background-color 120ms ease;
      }
      button:hover  { background: var(--dt-black-hover); }
      button:active { background: #100D0E; }
      button:disabled {
        background: #C9C2C4;
        color: #fff;
        cursor: default;
      }
      .err {
        margin-top: 14px;
        color: var(--dt-error);
        font-size: 13px;
        min-height: 1em;
      }
    </style>
  </head>
  <body>
    <form class="card" id="form" novalidate>
      <div class="brand" aria-label="ex">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M12 12 H52 A6 6 0 0 1 58 18 V40 A6 6 0 0 1 52 46 H28 L18 56 V46 H12 A6 6 0 0 1 6 40 V18 A6 6 0 0 1 12 12 Z"
                fill="#ffffff" stroke="#231F20" stroke-width="3" stroke-linejoin="round"/>
          <circle cx="20" cy="29" r="3" fill="#231F20"/>
          <circle cx="32" cy="29" r="3" fill="#231F20"/>
          <circle cx="44" cy="29" r="3" fill="#DE5D83"/>
        </svg>
      </div>
      <h1>Connect your workspace</h1>
      <p class="sub">Enter the URL of your team's chat server to get started.</p>
      <label for="url">Chat URL</label>
      <input
        id="url"
        type="url"
        placeholder="https://chat.example.com"
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        required
      />
      <button id="submit" type="submit">Continue</button>
      <div class="err" id="err"></div>
    </form>
    <script src="setup.js"></script>
  </body>
</html>
