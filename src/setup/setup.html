<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ex — Connect</title>
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        display: grid;
        place-items: center;
        font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #1f2937;
        background: linear-gradient(180deg, #0066ff 0%, #7fc4ff 100%);
        -webkit-user-select: none;
      }
      .card {
        width: 360px;
        padding: 28px 28px 24px;
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 22px 50px rgba(0, 0, 0, 0.18);
      }
      h1 { margin: 0 0 4px; font-size: 18px; }
      p.sub { margin: 0 0 18px; color: #6b7280; font-size: 13px; }
      label { display: block; font-size: 12px; color: #374151; margin-bottom: 6px; }
      input[type="url"] {
        width: 100%; padding: 10px 12px; font-size: 14px;
        border: 1px solid #d1d5db; border-radius: 8px; outline: none;
        -webkit-user-select: text; user-select: text;
      }
      input[type="url"]:focus { border-color: #0066ff; box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.18); }
      button {
        margin-top: 16px; width: 100%; padding: 10px 12px;
        background: #0066ff; color: #fff; border: 0; border-radius: 8px;
        font-size: 14px; font-weight: 500; cursor: pointer;
      }
      button:hover { background: #0052cc; }
      button:disabled { background: #93c5fd; cursor: default; }
      .err { margin-top: 10px; color: #b91c1c; font-size: 12px; min-height: 1em; }
    </style>
  </head>
  <body>
    <form class="card" id="form">
      <h1>Connect to Ex</h1>
      <p class="sub">Enter the URL of your team's chat server.</p>
      <label for="url">Chat URL</label>
      <input
        id="url"
        type="url"
        placeholder="https://chat.example.com"
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        required
      />
      <button id="submit" type="submit">Continue</button>
      <div class="err" id="err"></div>
    </form>
    <script src="setup.js"></script>
  </body>
</html>
