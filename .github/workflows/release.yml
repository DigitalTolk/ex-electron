name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-26 ships Xcode 26 — required for actool to compile the
          # .icon source into Assets.car (macOS 26 dynamic icon).
          - os: macos-26
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux
          # Pinned to the VS-2026 image; `windows-latest` is being redirected
          # to this same image by 2026-05-12 anyway.
          - os: windows-2025-vs2026
            script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Package
        # Icons live in prebuilt/ tracked in git; we don't regenerate during
        # the packaging step. Run `make regen-icons` locally after editing
        # the source assets and commit the result.
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing + notarization. CSC_LINK is the base64 of the
          # Developer ID Application .p12; APPLE_* drive notarytool.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ex-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.exe
          if-no-files-found: warn

  mac-app-store:
    name: Mac App Store
    # Independent of the direct-download packages: a store rejection must not
    # hold back the GitHub Release, and vice versa.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: npm ci
      - name: Package for the Mac App Store
        run: npm run dist:mas
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
          # Apple Distribution (application) and Mac Installer Distribution
          # certificates, each a base64 .p12. These are NOT the Developer ID
          # certificate the direct-download build signs with.
          CSC_LINK: ${{ secrets.MAS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAS_CSC_KEY_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.MAS_INSTALLER_CSC_LINK }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.MAS_INSTALLER_CSC_KEY_PASSWORD }}
      - name: Generate App Store release notes
        run: npx tsx scripts/release-notes.ts --store > release/mas-release-notes.txt
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: eu-north-1
          BEDROCK_MODEL_ID: ${{ secrets.BEDROCK_MODEL_ID }}
      - name: Upload to App Store Connect
        run: bundle exec fastlane mac app_store_release
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      - name: Keep the package
        uses: actions/upload-artifact@v7
        with:
          name: ex-mac-app-store
          path: release/**/*-mas-*.pkg
      - name: Clean signing material
        if: always()
        run: rm -rf prebuilt/mas

  release:
    name: GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so release-notes.ts can `git log` from the previous
          # tag through the current one.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate AI release notes
        env:
          # Bedrock-backed Claude Sonnet 4.6 (eu-north-1). Long-term Bedrock
          # API key — the SDK reads it directly from this env var. If it isn't
          # set, the script falls back to a plain commit list. The model id is
          # the cross-region inference-profile ARN; held as a secret since it
          # contains the account number.
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: eu-north-1
          BEDROCK_MODEL_ID: ${{ secrets.BEDROCK_MODEL_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npx tsx scripts/release-notes.ts > release-notes.md
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: artifacts/*
