name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage/lcov.info
          format: lcov

  build:
    name: Build (${{ matrix.os }})
    needs: lint-test
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-26 carries Xcode 26's actool, which is required to compile
          # the .icon source into Assets.car for macOS 26's dynamic icon.
          - os: macos-26
          - os: ubuntu-latest
          # Pinned to the VS-2026 image; `windows-latest` is being redirected
          # to this same image by 2026-05-12 anyway.
          - os: windows-2025-vs2026
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run bundle
      # Icons live in prebuilt/ tracked in git; no regeneration needed in CI.
      # Run `make regen-icons` locally after editing assets/ex.icon.
      - name: electron-builder --dir (smoke)
        run: npx tsx scripts/build-app.ts --dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The Mac App Store job only runs on a release tag, so a break in it used to
  # surface only after tagging (v0.0.19: CI's gem install in vendor/bundle
  # tripped `eslint .`). PRs that touch what that job depends on run it here,
  # same environment and secrets, up to the signed .pkg — without uploading.
  mas-changes:
    name: Mac App Store inputs changed?
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            | grep -qE '^(fastlane/|Gemfile|prebuilt/|scripts/(build-mas|build-app|derive-version|release-notes)\.ts$|electron-builder\.yml$|package(-lock)?\.json$|eslint\.config\.mjs$|\.github/workflows/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  mas-dry-run:
    name: Mac App Store dry run
    needs: mas-changes
    # Signing needs the repository secrets, which fork and Dependabot PRs
    # don't get.
    if: >-
      needs.mas-changes.outputs.changed == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: npm ci
      - name: Package for the Mac App Store
        run: npm run dist:mas
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
          CSC_LINK: ${{ secrets.MAS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAS_CSC_KEY_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.MAS_INSTALLER_CSC_LINK }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.MAS_INSTALLER_CSC_KEY_PASSWORD }}
          # electron-builder skips signing on any PR build unless told
          # otherwise; this job's `if` already limits it to same-repo PRs.
          CSC_FOR_PULL_REQUEST: 'true'
      - name: Check the package the upload lane would pick up
        run: |
          pkg=$(find release -name '*-mas-*.pkg' | head -1)
          test -n "$pkg" || { echo "no Mac App Store package under release/"; exit 1; }
          pkgutil --check-signature "$pkg"
          codesign --verify --deep --strict release/mas-arm64/*.app
      - name: Store release notes (fallback text without Bedrock)
        # On a PR GITHUB_REF_NAME is "<n>/merge", not a ref git knows, and a
        # step's `env:` can't override GITHUB_* — set it on the command.
        run: GITHUB_REF_NAME=HEAD npx tsx scripts/release-notes.ts --store
      - name: Load the fastlane lanes
        run: bundle exec fastlane lanes
      - name: Clean signing material
        if: always()
        run: rm -rf prebuilt/mas
